<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Mozo SDK -->
  <script src="/v4/app-store/sdk/mozo-sdk.js"></script>

  <title>Hexa AI - Mozo Widget</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 24px rgba(15,23,42,.06);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: .12em;
      color:#0369a1;
      font-weight:700;
      text-transform:uppercase;
    }

    h1 {
      margin-top:6px;
      font-size:22px;
    }

    p {
      margin-top:8px;
      color:#475569;
      font-size:13px;
    }

    .meta {
      margin-top:14px;
      display:grid;
      gap:6px;
      font-size:13px;
    }

    .actions {
      margin-top:16px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    button {
      padding:10px 14px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
    }

    .primary {
      background:#0f766e;
      color:white;
    }

    .secondary {
      background:#e2e8f0;
    }


    .feed {
      margin-top:16px;
      display:grid;
      gap:10px;
    }


    .feed-item {
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:12px;
    }


    .row {
      display:flex;
      justify-content:space-between;
      gap:10px;
    }


    .status {
      margin-top:8px;
      display:inline-block;
      padding:3px 8px;
      border-radius:20px;
      font-size:11px;
      background:#dcfce7;
      color:#166534;
    }


    .log {
      margin-top:15px;
      font-size:12px;
    }


    .log-success {
      color:#047857;
    }


    .log-error {
      color:#b91c1c;
    }


  </style>

</head>


<body>


<section class="card">


  <div class="eyebrow">
    Mozo App Store · Widget
  </div>


  <h1>
    Hexa AI Call Assistant
  </h1>


  <p>
    AI handled restaurant calls, bookings and orders from Hexa AI.
  </p>


  <div class="meta">

    <div>
      <strong>Installation:</strong>
      <span id="installationId">-</span>
    </div>


    <div>
      <strong>Venue:</strong>
      <span id="venueId">-</span>
    </div>


    <div>
      <strong>Origin:</strong>
      <span id="hostOrigin">-</span>
    </div>


  </div>



  <div class="actions">


    <button
            class="primary"
            id="loadActivity">
      Refresh Calls
    </button>


    <button
            class="primary"
            id="loadMenu">
      Load Menu
    </button>


    <button
            class="primary"
            id="loadOrders">
      Load Orders
    </button>


    <button
            class="secondary"
            id="toast">
      Toast
    </button>


  </div>



  <div id="feed" class="feed">

    <div>
      No activity loaded.
    </div>


  </div>



  <div id="log" class="log"></div>



</section>





<script>


  const BACKEND_URL =
          new URLSearchParams(location.search).get("backend")
          ||
          "https://api.gethexa.ai/mozo";



  let mozoSession = null;
  let venueId = null;



  function $(id){

    return document.getElementById(id);

  }



  function log(message,type="success"){

    const div=document.createElement("div");

    div.className="log-"+type;

    div.textContent =
            `[${new Date().toLocaleTimeString()}] ${message}`;

    $("log").prepend(div);

  }



  function setText(id,value){

    $(id).textContent=value || "-";

  }





  /**
   * Initialize Mozo
   */
  async function initMozo(){


    try{


      if(!window.Mozo){

        throw new Error(
                "Mozo SDK not available"
        );

      }



      mozoSession =
              await window.Mozo.initialize();



      console.log(
              "MOZO SESSION",
              mozoSession
      );



      venueId =
              mozoSession
                      ?.context
                      ?.installation
                      ?.venue_id;



      setText(
              "installationId",
              mozoSession?.context?.installation?.id
      );


      setText(
              "venueId",
              venueId
      );


      setText(
              "hostOrigin",
              window.location.origin
      );



      log(
              "Mozo initialized"
      );



      loadActivity();



    }
    catch(error){

      log(
              error.message,
              "error"
      );


    }


  }







  /**
   * Backend Request
   */
  async function api(path,options={}){


    if(!mozoSession){

      throw new Error(
              "Mozo session missing"
      );

    }


    const response =
            await fetch(
                    BACKEND_URL + path +
                    "?venue_id="+encodeURIComponent(venueId),
                    {


                      ...options,


                      headers:{


                        "Content-Type":
                                "application/json",


                        "Authorization":
                                "Bearer "+
                                (
                                        mozoSession.token
                                        ||
                                        mozoSession.accessToken
                                )


                      }


                    }
            );



    const data =
            await response.json();


    if(!response.ok){

      throw new Error(
              data.error || "Request failed"
      );

    }



    return data;


  }







  function renderCalls(calls){


    const feed=$("feed");


    feed.innerHTML="";



    if(!calls || calls.length===0){

      feed.innerHTML =
              "No calls found.";

      return;

    }




    calls.forEach(call=>{


      const item =
              document.createElement("div");


      item.className="feed-item";



      item.innerHTML = `

<div class="row">

<strong>
${call.phoneNumberFrom || "Unknown"}
</strong>


<span>
${new Date(call.createdAt)
              .toLocaleString()}
</span>


</div>


<div class="status">
${call.status}
</div>


<p>
Duration:
${call.duration || 0}s
</p>


`;



      feed.appendChild(item);



    });



  }







  async function loadActivity(){


    try{


      const data =
              await api(
                      "/hexaai/activity"
              );


      renderCalls(data);


      log(
              "Activity loaded"
      );



    }
    catch(error){

      log(
              error.message,
              "error"
      );


    }



  }







  async function loadMenu(){


    try{


      const data =
              await api(
                      "/menu"
              );


      console.log(data);


      log(
              "Menu loaded"
      );



    }
    catch(error){

      log(
              error.message,
              "error"
      );


    }



  }







  async function loadOrders(){


    try{


      const data =
              await api(
                      "/orders"
              );


      console.log(data);


      log(
              "Orders loaded"
      );



    }
    catch(error){

      log(
              error.message,
              "error"
      );


    }



  }







  function mozoToast(){


    if(
            window.Mozo?.ui?.toast
    ){


      window.Mozo.ui.toast({

        message:
                "Hello from Hexa AI"

      });


    }


    else{


      log(
              "Toast API unavailable",
              "error"
      );


    }



  }







  $("loadActivity")
          .onclick =
          loadActivity;


  $("loadMenu")
          .onclick =
          loadMenu;


  $("loadOrders")
          .onclick =
          loadOrders;


  $("toast")
          .onclick =
          mozoToast;





  initMozo();



</script>



</body>

</html>
